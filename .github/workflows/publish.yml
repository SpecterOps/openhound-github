name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  build-python:
    needs: test
    uses: SpecterOps/openhound-workflows/.github/workflows/build-python.yml@5c902e58782c9552e2d36950dc743e9237ca4356
    with:
      tag: ${{ github.event.release.tag_name }}
      python-version: '3.13'

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - name: Publish distributions to PyPI
        run: uv publish --trusted-publishing always dist/*

  publish-container:
    needs: publish-python
    permissions:
      contents: read
      packages: write
    uses: SpecterOps/openhound-workflows/.github/workflows/publish-container.yml@bd6b59e0018dc3b3326858e4a8baa5b7ebf6efe5
    with:
      tag: ${{ github.event.release.tag_name }}
      prerelease: ${{ github.event.release.prerelease }}
